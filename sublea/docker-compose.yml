services:
  db:
    image: postgres:15-alpine
    container_name: sublea-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sublea_user -d sublea_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: sublea-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: sublea-frontend
    ports:
      - "3000:80"  # Map Mac's 3000 to Nginx's 80
    depends_on:
      - backend

volumes:
  postgres_data: